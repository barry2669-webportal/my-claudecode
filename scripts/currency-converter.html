<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匯率換算</title>
<style>
  :root {
    --bg: #f4f5f7;
    --bg-elevated: #ffffff;
    --border: #e2e4e9;
    --text: #1b1e26;
    --text-muted: #6b7280;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
    --mono-bg: #f7f7f9;
    --ok: #16a34a;
    --danger: #b91c1c;
    --danger-bg: rgba(220,38,38,0.08);
    --danger-border: rgba(220,38,38,0.35);
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c;
      --bg-elevated: #1c1f27;
      --border: #2b2f3a;
      --text: #e6e8ec;
      --text-muted: #9aa0ac;
      --accent: #818cf8;
      --accent-soft: #23253a;
      --mono-bg: #14161c;
      --ok: #4ade80;
      --danger: #f87171;
      --danger-bg: rgba(248,113,113,0.12);
      --danger-border: rgba(248,113,113,0.35);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 12px rgba(0,0,0,0.25);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 20px 80px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }

  .page { max-width: 780px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 26px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p { color: var(--text-muted); margin: 0; font-size: 14px; }

  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    box-shadow: var(--shadow);
  }

  .amount-card { margin-bottom: 24px; }

  .rate-status-card {
    margin-bottom: 18px;
    padding: 16px 20px;
  }

  .rate-status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .rate-status-text { min-width: 0; }
  .rate-status-line { font-size: 13px; font-weight: 700; }
  .rate-status-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .refresh-btn {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--mono-bg);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, opacity .15s ease;
  }
  .refresh-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .refresh-btn:disabled { opacity: .6; cursor: default; }

  .rate-error {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: var(--danger);
    font-size: 12.5px;
    line-height: 1.4;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* Flex row, not absolute-positioned overlays, so the currency code
     and the number can never overlap regardless of digit count. */
  .amount-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  #fromCurrency {
    flex: 0 0 128px;
    min-width: 0;
    padding: 0 10px;
    font-size: 15px;
    font-weight: 700;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--mono-bg);
    color: var(--text);
    outline: none;
    cursor: pointer;
  }
  #fromCurrency:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  #amount {
    flex: 1;
    min-width: 0;
    padding: 14px 16px;
    font-size: 26px;
    font-weight: 700;
    text-align: right;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--mono-bg);
    color: var(--text);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #amount:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  section.group { margin-top: 24px; }

  .group h2 {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 4px;
  }

  .group .sub {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 0 14px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
  }

  .rate-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--mono-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .rate-card.active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .rate-card .meta { min-width: 0; }
  .rate-card .code {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  .rate-card .name {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .rate-card .value {
    font-size: 19px;
    font-weight: 700;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .rate-card.active .value { color: var(--accent); }

  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 12px;
    color: var(--text-muted);
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>匯率換算</h1>
      <p>輸入金額即時換算，涵蓋台幣、美金、人民幣、日圓與常用旅遊/採購幣別</p>
    </header>

    <section class="card rate-status-card" id="rateStatusCard">
      <div class="rate-status-row">
        <div class="rate-status-text">
          <div class="rate-status-line" id="rateUpdatedText">正在載入匯率...</div>
          <div class="rate-status-sub" id="rateSourceText"></div>
        </div>
        <button type="button" id="refreshRatesBtn" class="refresh-btn">重新整理匯率</button>
      </div>
      <div class="rate-error" id="rateErrorBanner" hidden></div>
    </section>

    <section class="card amount-card">
      <label for="amount">輸入金額</label>
      <div class="amount-row">
        <select id="fromCurrency"></select>
        <input type="number" id="amount" value="1000" min="0" step="any" inputmode="decimal">
      </div>
    </section>

    <section class="group">
      <h2>常用四幣別</h2>
      <p class="sub">台幣、美金、人民幣、日圓</p>
      <div class="grid" id="primaryGrid"></div>
    </section>

    <section class="group">
      <h2>常用旅遊/採購幣別</h2>
      <p class="sub">歐元、韓元、港幣、泰銖、新加坡幣、澳幣、英鎊、越南盾</p>
      <div class="grid" id="secondaryGrid"></div>
    </section>

    <footer>
      匯率資料僅供試算，不代表正式報價<br>
      正式交易請以 <a href="https://rate.bot.com.tw/xrt?Lang=zh-TW" target="_blank" rel="noopener">台灣銀行牌告匯率</a> 為準・純前端計算，資料不會送出或儲存
    </footer>
  </div>

<script>
  // TWD value of 1 unit of each currency. These are the built-in fallback
  // rates used until (or unless) a live fetch from the API succeeds.
  const CURRENCIES = [
    { code: "TWD", name: "新台幣", rate: 1,        decimals: 2, group: "primary" },
    { code: "USD", name: "美金",   rate: 32.03,    decimals: 2, group: "primary" },
    { code: "CNY", name: "人民幣", rate: 4.755,    decimals: 2, group: "primary" },
    { code: "JPY", name: "日圓",   rate: 0.2179,   decimals: 0, group: "primary" },
    { code: "EUR", name: "歐元",   rate: 34.91,    decimals: 2, group: "secondary" },
    { code: "KRW", name: "韓元",   rate: 0.02321,  decimals: 0, group: "secondary" },
    { code: "HKD", name: "港幣",   rate: 4.084,    decimals: 2, group: "secondary" },
    { code: "THB", name: "泰銖",   rate: 0.9715,   decimals: 2, group: "secondary" },
    { code: "SGD", name: "新加坡幣", rate: 25.11,  decimals: 2, group: "secondary" },
    { code: "AUD", name: "澳幣",   rate: 22.83,    decimals: 2, group: "secondary" },
    { code: "GBP", name: "英鎊",   rate: 40.68,    decimals: 2, group: "secondary" },
    { code: "VND", name: "越南盾", rate: 0.001261, decimals: 0, group: "secondary" }
  ];

  const RATE_BY_CODE = Object.fromEntries(CURRENCIES.map(c => [c.code, c]));

  const fromSelect = document.getElementById("fromCurrency");
  const amountInput = document.getElementById("amount");
  const primaryGrid = document.getElementById("primaryGrid");
  const secondaryGrid = document.getElementById("secondaryGrid");

  CURRENCIES.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.code;
    opt.textContent = c.code + " " + c.name;
    fromSelect.appendChild(opt);
  });
  fromSelect.value = "TWD";

  function buildCard(c) {
    const card = document.createElement("div");
    card.className = "rate-card";
    card.dataset.code = c.code;

    const meta = document.createElement("div");
    meta.className = "meta";
    const codeEl = document.createElement("div");
    codeEl.className = "code";
    codeEl.textContent = c.code;
    const nameEl = document.createElement("div");
    nameEl.className = "name";
    nameEl.textContent = c.name;
    meta.appendChild(codeEl);
    meta.appendChild(nameEl);

    const valueEl = document.createElement("div");
    valueEl.className = "value";
    valueEl.textContent = "-";

    card.appendChild(meta);
    card.appendChild(valueEl);
    return card;
  }

  CURRENCIES.forEach(c => {
    const card = buildCard(c);
    (c.group === "primary" ? primaryGrid : secondaryGrid).appendChild(card);
  });

  function formatValue(n, decimals) {
    if (!isFinite(n)) return "-";
    return n.toLocaleString("zh-TW", {
      minimumFractionDigits: decimals,
      maximumFractionDigits: decimals
    });
  }

  function renderAll() {
    const amount = parseFloat(amountInput.value);
    const fromCode = fromSelect.value;
    const fromRate = RATE_BY_CODE[fromCode].rate;
    const validAmount = isFinite(amount) && amount >= 0;
    const twdValue = validAmount ? amount * fromRate : NaN;

    document.querySelectorAll(".rate-card").forEach(card => {
      const code = card.dataset.code;
      const c = RATE_BY_CODE[code];
      const valueEl = card.querySelector(".value");
      const isActive = code === fromCode;
      card.classList.toggle("active", isActive);

      if (!validAmount) {
        valueEl.textContent = "-";
        return;
      }
      const converted = isActive ? amount : (twdValue / c.rate);
      valueEl.textContent = formatValue(converted, c.decimals);
    });
  }

  amountInput.addEventListener("input", renderAll);
  fromSelect.addEventListener("change", renderAll);

  renderAll();

  // Live rates: Frankfurter (ECB-based) doesn't publish TWD or VND, so this
  // page uses open.er-api.com instead (also free, no API key, base=TWD
  // gives every other currency's value per 1 TWD directly).
  const RATES_API_URL = "https://open.er-api.com/v6/latest/TWD";
  const FALLBACK_DATE_LABEL = "2026-08-18";

  const rateUpdatedText = document.getElementById("rateUpdatedText");
  const rateSourceText = document.getElementById("rateSourceText");
  const rateErrorBanner = document.getElementById("rateErrorBanner");
  const refreshBtn = document.getElementById("refreshRatesBtn");

  let isFetchingRates = false;
  let hasLiveRates = false;

  function showRateError(message) {
    rateErrorBanner.textContent = message;
    rateErrorBanner.hidden = false;
  }

  function hideRateError() {
    rateErrorBanner.hidden = true;
    rateErrorBanner.textContent = "";
  }

  function setLoadingUI(loading) {
    refreshBtn.disabled = loading;
    refreshBtn.textContent = loading ? "更新中..." : "重新整理匯率";
  }

  async function fetchLiveRates() {
    if (isFetchingRates) return;
    isFetchingRates = true;
    setLoadingUI(true);
    hideRateError();

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 8000);

    try {
      const res = await fetch(RATES_API_URL, { signal: controller.signal });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (data.result !== "success" || !data.rates) throw new Error("回傳格式異常");

      CURRENCIES.forEach(c => {
        if (c.code === "TWD") return;
        const apiRate = data.rates[c.code]; // units of c.code per 1 TWD
        if (typeof apiRate === "number" && apiRate > 0) {
          c.rate = 1 / apiRate; // TWD per 1 unit of c.code
        }
      });

      hasLiveRates = true;
      const updatedAt = data.time_last_update_utc ? new Date(data.time_last_update_utc) : new Date();
      rateUpdatedText.textContent = "匯率更新時間：" + updatedAt.toLocaleString("zh-TW", {
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hour12: false
      });
      rateSourceText.textContent = "資料來源：open.er-api.com（即時匯率）";
    } catch (err) {
      const reason = err.name === "AbortError" ? "連線逾時" : (err.message || "未知錯誤");
      if (!hasLiveRates) {
        rateUpdatedText.textContent = "使用內建參考匯率（資料日期 " + FALLBACK_DATE_LABEL + "）";
        rateSourceText.textContent = "尚未取得即時匯率";
        showRateError("即時匯率抓取失敗（" + reason + "），目前顯示內建參考匯率，僅供試算。");
      } else {
        showRateError("重新整理匯率失敗（" + reason + "），目前仍顯示上次成功取得的即時匯率。");
      }
    } finally {
      clearTimeout(timeoutId);
      isFetchingRates = false;
      setLoadingUI(false);
      renderAll();
    }
  }

  refreshBtn.addEventListener("click", fetchLiveRates);

  rateUpdatedText.textContent = "使用內建參考匯率（資料日期 " + FALLBACK_DATE_LABEL + "）";
  rateSourceText.textContent = "正在抓取即時匯率...";
  fetchLiveRates();
</script>
</body>
</html>
