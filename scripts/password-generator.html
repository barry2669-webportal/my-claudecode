<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密碼產生器</title>
<style>
  :root {
    --bg: #f4f5f7;
    --bg-elevated: #ffffff;
    --border: #e2e4e9;
    --text: #1b1e26;
    --text-muted: #6b7280;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
    --mono-bg: #f7f7f9;
    --weak: #dc2626;
    --fair: #d97706;
    --strong: #16a34a;
    --vstrong: #059669;
    --track: #e5e7eb;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c;
      --bg-elevated: #1c1f27;
      --border: #2b2f3a;
      --text: #e6e8ec;
      --text-muted: #9aa0ac;
      --accent: #818cf8;
      --accent-soft: #23253a;
      --mono-bg: #14161c;
      --weak: #f87171;
      --fair: #fbbf24;
      --strong: #4ade80;
      --vstrong: #34d399;
      --track: #2b2f3a;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 12px rgba(0,0,0,0.25);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 20px 80px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }

  .page { max-width: 560px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 32px; }

  header h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  header p { color: var(--text-muted); margin: 0; font-size: 14px; }

  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    box-shadow: var(--shadow);
  }

  .password-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--mono-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 6px 6px 16px;
    margin-bottom: 14px;
  }

  #password {
    flex: 1;
    border: none;
    background: transparent;
    outline: none;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.02em;
    min-width: 0;
    padding: 8px 0;
  }

  .icon-btn {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }

  .icon-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 18px; height: 18px; }

  .copy-feedback {
    text-align: right;
    font-size: 12.5px;
    color: var(--strong);
    height: 16px;
    margin: -6px 2px 12px;
    opacity: 0;
    transition: opacity .15s ease;
  }
  .copy-feedback.show { opacity: 1; }

  .strength-block { margin-bottom: 22px; }

  .strength-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .strength-label { font-size: 13px; font-weight: 600; }
  .strength-bits { font-size: 12px; color: var(--text-muted); }

  .strength-bar {
    height: 8px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
  }

  .strength-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    transition: width .2s ease, background .2s ease;
  }

  .field { margin-bottom: 18px; }

  .field-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .field label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
  }

  #lengthValue {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-weight: 700;
    color: var(--accent);
    font-size: 14px;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 6px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    cursor: pointer;
    font-size: 13.5px;
    user-select: none;
    transition: border-color .15s ease, background .15s ease;
  }

  .option:hover { border-color: var(--accent); }

  .option input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }

  .error-msg {
    font-size: 13px;
    color: var(--weak);
    margin-top: 8px;
    display: none;
  }
  .error-msg.show { display: block; }

  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 12px;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>密碼產生器</h1>
      <p>本機隨機產生，不會上傳或儲存任何內容</p>
    </header>

    <div class="card">
      <div class="password-box">
        <input type="text" id="password" readonly>
        <button class="icon-btn" id="regenBtn" title="重新產生">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button class="icon-btn" id="copyBtn" title="複製到剪貼簿">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
      <div class="copy-feedback" id="copyFeedback">已複製到剪貼簿</div>

      <div class="strength-block">
        <div class="strength-row">
          <span class="strength-label" id="strengthLabel">-</span>
          <span class="strength-bits" id="strengthBits">-</span>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      </div>

      <hr class="divider">

      <div class="field">
        <div class="field-row">
          <label for="lengthRange">密碼長度</label>
          <span id="lengthValue">16</span>
        </div>
        <input type="range" id="lengthRange" min="4" max="20" value="16">
      </div>

      <div class="options">
        <label class="option">
          <input type="checkbox" id="optUpper" checked>
          大寫字母 A-Z
        </label>
        <label class="option">
          <input type="checkbox" id="optLower" checked>
          小寫字母 a-z
        </label>
        <label class="option">
          <input type="checkbox" id="optNumbers" checked>
          數字 0-9
        </label>
        <label class="option">
          <input type="checkbox" id="optSymbols" checked>
          特殊符號 !@#$…
        </label>
      </div>

      <label class="option" style="grid-column: 1 / -1;">
        <input type="checkbox" id="optAmbiguous">
        避免混淆字元（0/O、1/l/I 等）
      </label>

      <div class="error-msg" id="errorMsg">請至少勾選一種字元類型</div>
    </div>

    <footer>密碼以瀏覽器安全亂數（crypto.getRandomValues）產生</footer>
  </div>

<script>
  const CHARSETS = {
    upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    lower: "abcdefghijklmnopqrstuvwxyz",
    numbers: "0123456789",
    symbols: "!@#$%^&*()_+-=[]{}|;:,.<>?/~"
  };
  const AMBIGUOUS = /[0O1lI|]/g;

  const lengthRange = document.getElementById("lengthRange");
  const lengthValue = document.getElementById("lengthValue");
  const optUpper = document.getElementById("optUpper");
  const optLower = document.getElementById("optLower");
  const optNumbers = document.getElementById("optNumbers");
  const optSymbols = document.getElementById("optSymbols");
  const optAmbiguous = document.getElementById("optAmbiguous");
  const passwordEl = document.getElementById("password");
  const errorMsg = document.getElementById("errorMsg");
  const strengthLabel = document.getElementById("strengthLabel");
  const strengthBits = document.getElementById("strengthBits");
  const strengthFill = document.getElementById("strengthFill");
  const copyFeedback = document.getElementById("copyFeedback");

  function secureRandomInt(maxExclusive) {
    const arr = new Uint32Array(1);
    const limit = Math.floor(0xFFFFFFFF / maxExclusive) * maxExclusive;
    let val;
    do {
      crypto.getRandomValues(arr);
      val = arr[0];
    } while (val >= limit);
    return val % maxExclusive;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = secureRandomInt(i + 1);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function stripAmbiguous(str) {
    return str.replace(AMBIGUOUS, "");
  }

  function buildActiveSets() {
    const sets = [];
    if (optUpper.checked) sets.push(CHARSETS.upper);
    if (optLower.checked) sets.push(CHARSETS.lower);
    if (optNumbers.checked) sets.push(CHARSETS.numbers);
    if (optSymbols.checked) sets.push(CHARSETS.symbols);

    if (optAmbiguous.checked) {
      return sets.map(stripAmbiguous).filter(s => s.length > 0);
    }
    return sets.filter(s => s.length > 0);
  }

  function generatePassword(length, sets) {
    const pool = sets.join("");
    const chars = [];

    // guarantee at least one character from each selected category
    for (const set of sets) {
      chars.push(set[secureRandomInt(set.length)]);
    }
    for (let i = chars.length; i < length; i++) {
      chars.push(pool[secureRandomInt(pool.length)]);
    }

    return shuffle(chars).slice(0, length).join("");
  }

  function computeStrength(length, poolSize) {
    if (poolSize <= 1) return { bits: 0, level: 0 };
    const bits = length * Math.log2(poolSize);
    let level;
    if (bits < 40) level = 0;
    else if (bits < 60) level = 1;
    else if (bits < 80) level = 2;
    else level = 3;
    return { bits, level };
  }

  const LEVELS = [
    { label: "弱", color: "var(--weak)", width: "25%" },
    { label: "普通", color: "var(--fair)", width: "50%" },
    { label: "強", color: "var(--strong)", width: "75%" },
    { label: "非常強", color: "var(--vstrong)", width: "100%" }
  ];

  function update() {
    const length = parseInt(lengthRange.value, 10);
    lengthValue.textContent = length;

    const sets = buildActiveSets();

    if (sets.length === 0) {
      errorMsg.classList.add("show");
      passwordEl.value = "";
      strengthLabel.textContent = "-";
      strengthBits.textContent = "-";
      strengthFill.style.width = "0%";
      return;
    }
    errorMsg.classList.remove("show");

    const password = generatePassword(length, sets);
    passwordEl.value = password;

    const poolSize = sets.join("").length;
    const { bits, level } = computeStrength(length, poolSize);
    const info = LEVELS[level];

    strengthLabel.textContent = info.label;
    strengthLabel.style.color = info.color;
    strengthBits.textContent = "約 " + Math.round(bits) + " bits 熵";
    strengthFill.style.width = info.width;
    strengthFill.style.background = info.color;
  }

  [lengthRange, optUpper, optLower, optNumbers, optSymbols, optAmbiguous].forEach(el => {
    el.addEventListener("input", update);
    el.addEventListener("change", update);
  });

  document.getElementById("regenBtn").addEventListener("click", update);

  document.getElementById("copyBtn").addEventListener("click", async () => {
    if (!passwordEl.value) return;
    try {
      await navigator.clipboard.writeText(passwordEl.value);
    } catch (e) {
      passwordEl.select();
      document.execCommand("copy");
    }
    copyFeedback.classList.add("show");
    clearTimeout(window.__copyTimer);
    window.__copyTimer = setTimeout(() => copyFeedback.classList.remove("show"), 1500);
  });

  passwordEl.addEventListener("click", () => passwordEl.select());

  update();
</script>
</body>
</html>
